<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-label="BudgetX: AI-powered personal finance manager. Track salary, EMIs and expenses, see what&#39;s safe to invest, and get AI guidance checked against safety rules. Spring Boot microservices behind an API gateway, plus an installable React app. Stack: Java 17, Spring Boot, Spring Cloud, Kafka, Redis, MySQL, Docker, React. Status: Core services done.">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131418"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>

</defs>
<style>.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#card)" stroke="#22252b"/><rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#grid)"/><g class="in"><text x="48" y="60" class="mono" font-size="11.5" fill="#6f6f72" letter-spacing="2.2">01 · MICROSERVICES · FINTECH · 2026</text><rect x="48" y="78" width="177" height="26" rx="13" fill="#c8a465" fill-opacity=".12" stroke="#c8a465" stroke-opacity=".35"/><circle cx="63" cy="91" r="3.5" fill="#c8a465" class="pulse"/><text x="74" y="95" class="mono" font-size="10.5" fill="#e3c78f" letter-spacing="1.6">CORE SERVICES DONE</text></g><g class="in d1"><text x="44" y="172" class="serif" font-size="62" fill="#ece8e1">BudgetX</text><text x="48" y="206" class="serif" font-size="22" fill="#e3c78f" font-style="italic">AI-powered personal finance manager</text></g><g class="in d2"><text x="48" y="244" class="sans" font-size="15" fill="#a4a29c">Track salary, EMIs and expenses, see what&#39;s safe to invest, and get AI</text><text x="48" y="268" class="sans" font-size="15" fill="#a4a29c">guidance checked against safety rules. Spring Boot microservices</text><text x="48" y="292" class="sans" font-size="15" fill="#a4a29c">behind an API gateway, plus an installable React app.</text></g><line x1="48" y1="322" x2="650" y2="322" stroke="#22252b"/><g class="in d3"><text x="48" y="366" class="serif" font-size="38" fill="#ece8e1">5 of 8</text><text x="48" y="390" class="sans" font-size="13" fill="#a4a29c">services built, behind one</text><text x="48" y="407" class="sans" font-size="13" fill="#a4a29c">gateway</text><text x="252" y="366" class="serif" font-size="38" fill="#ece8e1">20/s</text><text x="252" y="390" class="sans" font-size="13" fill="#a4a29c">per-user rate limit with</text><text x="252" y="407" class="sans" font-size="13" fill="#a4a29c">Redis</text><text x="456" y="366" class="serif" font-size="38" fill="#ece8e1">15 min</text><text x="456" y="390" class="sans" font-size="13" fill="#a4a29c">JWT access tokens, 7-day</text><text x="456" y="407" class="sans" font-size="13" fill="#a4a29c">refresh</text></g><g class="in d4"><rect x="48" y="426" width="72" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="84" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Java 17</text><rect x="126" y="426" width="99" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="175.5" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Spring Boot</text><rect x="231" y="426" width="106" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="284" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Spring Cloud</text><rect x="343" y="426" width="58" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="372" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Kafka</text><rect x="407" y="426" width="58" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="436" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Redis</text><rect x="471" y="426" width="58" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="500" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">MySQL</text><rect x="535" y="426" width="65" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="567.5" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Docker</text><rect x="606" y="426" width="58" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="635" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">React</text></g><rect x="690" y="24" width="486" height="424" rx="18" fill="#0f1013" stroke="#22252b"/><text x="712" y="52" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">FIG. 02 · SERVICE MAP</text><g transform="translate(693 66)"><rect x="150" y="8" width="180" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="240" y="31.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">React web app · PWA</text><rect x="110" y="84" width="260" height="44" rx="10" fill="#1e1b14" stroke="#c8a465" stroke-opacity=".7"/><text x="240" y="110.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">API Gateway · JWT · Redis</text><g fill="none" stroke="#3d424b" stroke-width="1.4"><path d="M240 46V84"/><path d="M240 128C240 152 66 152 66 176"/><path d="M240 128C240 152 182 152 182 176"/><path d="M240 128C240 152 298 152 298 176"/><path d="M240 128C240 152 414 152 414 176"/></g><rect x="16" y="176" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="66" y="199.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">User</text><rect x="132" y="176" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="182" y="199.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">EMI</text><rect x="248" y="176" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="298" y="199.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Expense</text><rect x="364" y="176" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="414" y="199.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Budget</text><rect x="16" y="228" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b"/><text x="66" y="251.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">AI agent</text><rect x="132" y="228" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b" stroke-dasharray="4 4"/><text x="182" y="251.5" class="sans" font-size="13" fill="#6f6f72" text-anchor="middle">Market</text><rect x="248" y="228" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b" stroke-dasharray="4 4"/><text x="298" y="251.5" class="sans" font-size="13" fill="#6f6f72" text-anchor="middle">Invest</text><rect x="364" y="228" width="100" height="38" rx="10" fill="#16181c" stroke="#2f333b" stroke-dasharray="4 4"/><text x="414" y="251.5" class="sans" font-size="13" fill="#6f6f72" text-anchor="middle">Notify</text><rect x="16" y="290" width="448" height="32" rx="16" fill="#c8a465" fill-opacity=".08" stroke="#c8a465" stroke-opacity=".45"/><text x="240" y="310" class="mono" font-size="11" fill="#e3c78f" text-anchor="middle" letter-spacing="2">KAFKA · ASYNC EVENTS</text><circle r="4" fill="#e3c78f"><animateMotion dur="3s" repeatCount="indefinite" path="M240 27V128C240 152 414 152 414 176"/></circle><circle r="3.5" fill="#c8a465"><animateMotion dur="4s" repeatCount="indefinite" path="M40 306H440"/></circle><text x="240" y="352" class="mono" font-size="9.5" fill="#6f6f72" text-anchor="middle" letter-spacing="1.2">EUREKA DISCOVERY · CONFIG SERVER · MYSQL PER SERVICE</text><rect x="150" y="364" width="14" height="9" rx="2" fill="#16181c" stroke="#2f333b"/><text x="170" y="372" class="mono" font-size="9" fill="#6f6f72" letter-spacing="1.5">BUILT</text><rect x="236" y="364" width="14" height="9" rx="2" fill="none" stroke="#2f333b" stroke-dasharray="3 2"/><text x="256" y="372" class="mono" font-size="9" fill="#6f6f72" letter-spacing="1.5">NEXT PHASE</text></g>
