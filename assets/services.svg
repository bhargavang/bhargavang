<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 404" width="1200" height="404" role="img" aria-label="Freelance services: Business websites (great for shops, clinics, restaurants); Online stores (great for Instagram &amp; WhatsApp sellers); Web apps &amp; APIs (great for startups &amp; growing teams); Fixes &amp; speed-ups (great for any existing website).">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131418"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>

</defs>
<style>.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="403" rx="22" fill="url(#card)" stroke="#22252b"/><rect x=".5" y=".5" width="1199" height="403" rx="22" fill="url(#grid)"/><g class="in d1"><rect x="48" y="24" width="544" height="170" rx="16" fill="#0f1013" stroke="#22252b"/><text x="74" y="60" class="mono" font-size="11" fill="#c8a465" letter-spacing="2">01</text><rect x="526" y="42" width="40" height="40" rx="11" fill="none" stroke="#2f333b"/><g transform="translate(534 50)" fill="none" stroke="#c8a465" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></g><text x="74" y="104" class="serif" font-size="31" fill="#ece8e1">Business websites</text><text x="74" y="132" class="sans" font-size="14.5" fill="#a4a29c">Fast, mobile-friendly sites that show up on</text><text x="74" y="154" class="sans" font-size="14.5" fill="#a4a29c">Google and turn visitors into bookings.</text><text x="74" y="176" class="mono" font-size="10" fill="#c8a465" letter-spacing="1.5">GREAT FOR</text><text x="160" y="176" class="sans" font-size="13" fill="#ece8e1">shops, clinics, restaurants</text></g><g class="in d2"><rect x="608" y="24" width="544" height="170" rx="16" fill="#0f1013" stroke="#22252b"/><text x="634" y="60" class="mono" font-size="11" fill="#c8a465" letter-spacing="2">02</text><rect x="1086" y="42" width="40" height="40" rx="11" fill="none" stroke="#2f333b"/><g transform="translate(1094 50)" fill="none" stroke="#c8a465" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l-1 13H7L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></g><text x="634" y="104" class="serif" font-size="31" fill="#ece8e1">Online stores</text><text x="634" y="132" class="sans" font-size="14.5" fill="#a4a29c">Shopify or WooCommerce stores, set up and</text><text x="634" y="154" class="sans" font-size="14.5" fill="#a4a29c">ready to take payments.</text><text x="634" y="176" class="mono" font-size="10" fill="#c8a465" letter-spacing="1.5">GREAT FOR</text><text x="720" y="176" class="sans" font-size="13" fill="#ece8e1">Instagram &amp; WhatsApp sellers</text></g><g class="in d3"><rect x="48" y="210" width="544" height="170" rx="16" fill="#0f1013" stroke="#22252b"/><text x="74" y="246" class="mono" font-size="11" fill="#c8a465" letter-spacing="2">03</text><rect x="526" y="228" width="40" height="40" rx="11" fill="none" stroke="#2f333b"/><g transform="translate(534 236)" fill="none" stroke="#c8a465" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"/><path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></g><text x="74" y="290" class="serif" font-size="31" fill="#ece8e1">Web apps &amp; APIs</text><text x="74" y="318" class="sans" font-size="14.5" fill="#a4a29c">Dashboards, booking systems and portals on</text><text x="74" y="340" class="sans" font-size="14.5" fill="#a4a29c">a solid Java or Node.js backend.</text><text x="74" y="362" class="mono" font-size="10" fill="#c8a465" letter-spacing="1.5">GREAT FOR</text><text x="160" y="362" class="sans" font-size="13" fill="#ece8e1">startups &amp; growing teams</text></g><g class="in d4"><rect x="608" y="210" width="544" height="170" rx="16" fill="#0f1013" stroke="#22252b"/><text x="634" y="246" class="mono" font-size="11" fill="#c8a465" letter-spacing="2">04</text><rect x="1086" y="228" width="40" height="40" rx="11" fill="none" stroke="#2f333b"/><g transform="translate(1094 236)" fill="none" stroke="#c8a465" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4 2.5-2.5z"/></g><text x="634" y="290" class="serif" font-size="31" fill="#ece8e1">Fixes &amp; speed-ups</text><text x="634" y="318" class="sans" font-size="14.5" fill="#a4a29c">Broken, slow or outdated site? Fixed fast,</text><text x="634" y="340" class="sans" font-size="14.5" fill="#a4a29c">then kept updated and secure.</text><text x="634" y="362" class="mono" font-size="10" fill="#c8a465" letter-spacing="1.5">GREAT FOR</text><text x="720" y="362" class="sans" font-size="13" fill="#ece8e1">any existing website</text></g>
</svg>
