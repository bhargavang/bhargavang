<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-label="CareDesk: appointment booking system. Clinics and salons juggle appointments in notebooks and phone calls, which leads to double bookings. Customers book a free slot online; staff run the day from a secure dashboard on a Java REST API. Stack: Java, Spring Boot, React, PostgreSQL, Docker. Status: In progress.">
