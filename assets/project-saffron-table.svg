<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-label="Saffron Table: restaurant website + online booking. Many restaurants still take bookings by phone, and their sites are slow on mobile. A fast, mobile-first site with menu, gallery and maps, plus a booking form that emails both guest and owner. Stack: Next.js, TypeScript, Tailwind, Node.js, PostgreSQL. Status: In progress.">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131418"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>

</defs>
<style>.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#card)" stroke="#22252b"/><rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#grid)"/><g class="in"><text x="48" y="60" class="mono" font-size="11.5" fill="#6f6f72" letter-spacing="2.2">02 · BUSINESS WEBSITE · RESTAURANTS · 2026</text><rect x="48" y="78" width="125" height="26" rx="13" fill="#c8a465" fill-opacity=".12" stroke="#c8a465" stroke-opacity=".35"/><circle cx="63" cy="91" r="3.5" fill="#c8a465" class="pulse"/><text x="74" y="95" class="mono" font-size="10.5" fill="#e3c78f" letter-spacing="1.6">IN PROGRESS</text></g><g class="in d1"><text x="44" y="172" class="serif" font-size="62" fill="#ece8e1">Saffron Table</text><text x="48" y="206" class="serif" font-size="22" fill="#e3c78f" font-style="italic">restaurant website + online booking</text></g><g class="in d2"><text x="48" y="244" class="sans" font-size="15" fill="#a4a29c">Many restaurants still take bookings by phone, and their sites are</text><text x="48" y="268" class="sans" font-size="15" fill="#a4a29c">slow on mobile. A fast, mobile-first site with menu, gallery and maps,</text><text x="48" y="292" class="sans" font-size="15" fill="#a4a29c">plus a booking form that emails both guest and owner.</text></g><line x1="48" y1="322" x2="650" y2="322" stroke="#22252b"/><g class="in d3"><text x="48" y="366" class="serif" font-size="38" fill="#ece8e1">24/7</text><text x="48" y="390" class="sans" font-size="13" fill="#a4a29c">online booking</text><text x="252" y="366" class="serif" font-size="38" fill="#ece8e1">2×</text><text x="252" y="390" class="sans" font-size="13" fill="#a4a29c">confirmation emails per</text><text x="252" y="407" class="sans" font-size="13" fill="#a4a29c">booking</text><text x="456" y="366" class="serif" font-size="38" fill="#ece8e1">1 file</text><text x="456" y="390" class="sans" font-size="13" fill="#a4a29c">rebrands it for any</text><text x="456" y="407" class="sans" font-size="13" fill="#a4a29c">restaurant</text></g><g class="in d4"><rect x="48" y="426" width="72" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="84" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Next.js</text><rect x="126" y="426" width="92" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="172" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">TypeScript</text><rect x="224" y="426" width="79" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="263.5" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Tailwind</text><rect x="309" y="426" width="72" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="345" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Node.js</text><rect x="387" y="426" width="92" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="433" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">PostgreSQL</text></g><rect x="690" y="24" width="486" height="424" rx="18" fill="#0f1013" stroke="#22252b"/><text x="712" y="52" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">FIG. 03 · BOOKING FLOW</text><g transform="translate(693 66)"><defs><marker id="ar" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L8 4 0 8z" fill="#3d424b"/></marker></defs><rect x="40" y="50" width="180" height="46" rx="10" fill="#16181c" stroke="#2f333b"/><text x="130" y="77.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Guest picks a time</text><rect x="40" y="150" width="180" height="46" rx="10" fill="#16181c" stroke="#2f333b"/><text x="130" y="177.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Booking form</text><rect x="40" y="250" width="180" height="46" rx="10" fill="#1e1b14" stroke="#c8a465" stroke-opacity=".7"/><text x="130" y="277.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">API + Postgres</text><rect x="282" y="150" width="168" height="46" rx="10" fill="#16181c" stroke="#2f333b"/><text x="366" y="177.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Email → guest</text><rect x="282" y="250" width="168" height="46" rx="10" fill="#16181c" stroke="#2f333b"/><text x="366" y="277.5" class="sans" font-size="13" fill="#ece8e1" text-anchor="middle">Email → owner</text><g fill="none" stroke="#3d424b" stroke-width="1.5" marker-end="url(#ar)"><path d="M130 96V148"/><path d="M130 196V248"/><path d="M220 273H280"/><path d="M220 273C252 273 250 173 280 173"/></g><circle r="4" fill="#e3c78f"><animateMotion dur="3.6s" repeatCount="indefinite" path="M130 73V273H282"/></circle><circle r="4" fill="#c8a465"><animateMotion dur="3.6s" begin="1.8s" repeatCount="indefinite" path="M130 73V273H220C252 273 250 173 282 173"/></circle></g>
</svg>
