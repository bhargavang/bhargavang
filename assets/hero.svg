<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Bhargav Angadi, software developer in India. Software that ships, and keeps working. Associate Software Engineer at Torry Harris Business Solutions. Open to freelance projects.">
<defs><clipPath id="card"><rect width="1200" height="400" rx="24"/></clipPath></defs>
<style>
  .serif{font-family:'EB Garamond','Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,serif}.sans{font-family:'Figtree',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
  .in{animation:in 1s cubic-bezier(.2,.7,.2,1) both}.d1{animation-delay:.08s}.d2{animation-delay:.16s}.d3{animation-delay:.26s}
  @keyframes in{from{opacity:0;transform:translateY(8px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="400" fill="#efe7dc"/>
  <text x="64" y="74" class="sans" font-size="20" font-weight="600" fill="#22314f">Bhargav Angadi</text>
  <text x="1136" y="74" class="sans" font-size="16" fill="#5f6577" text-anchor="end">bhargavang.github.io/bhargavang</text>
  <text x="600" y="142" class="sans in" font-size="13" font-weight="500" letter-spacing="2.6" fill="#5f6577" text-anchor="middle">SOFTWARE DEVELOPER · INDIA</text>
  <text x="600" y="214" class="serif in d1" font-size="70" letter-spacing="-1.6" fill="#22314f" text-anchor="middle">Software that ships,</text>
  <text x="600" y="286" class="serif in d2" font-size="70" font-style="italic" letter-spacing="-1.6" fill="#22314f" text-anchor="middle">and keeps working.</text>
  <path class="in d3" d="M0 352a24 24 0 0 1 24 -24h1152a24 24 0 0 1 24 24V400H0z" fill="#e2d5c3"/>
  <g class="in d3">
    <text x="600" y="370" class="sans" font-size="17" fill="#22314f" text-anchor="middle">Associate Software Engineer at Torry Harris Business Solutions<tspan fill="#5f6577">  ·  </tspan><tspan fill="#4f8a5b">●</tspan> Open to freelance projects</text>
  </g>
</g>
<rect x=".5" y=".5" width="1199" height="399" rx="24" fill="none" stroke="#dccfbd"/>
</svg>
