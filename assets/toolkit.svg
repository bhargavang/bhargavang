<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-label="Toolkit. Backend: Java, Spring Boot, Spring Cloud, REST APIs, Node.js, Express. Frontend: React, Next.js, TypeScript, JavaScript, HTML &amp; CSS, Tailwind. Data &amp; messaging: MySQL, Redis, Kafka, PostgreSQL, MongoDB, SQL. DevOps &amp; tools: Docker, Git &amp; GitHub, Maven, Vercel, Netlify. Stores &amp; CMS: Shopify, WordPress, WooCommerce, Stripe. Where I started: Python, Tableau, Power BI, Excel.">
