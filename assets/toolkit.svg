,.02)" stroke="#2f333b"/><text x="303" y="393.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">Maven</text><rect x="72" y="412" width="69" height="30" rx="15" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="106.5" y="431.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">Vercel</text><rect x="149" y="412" width="77" height="30" rx="15" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="187.5" y="431.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">Netlify</text><text x="72" y="490" class="serif" font-size="16.5" fill="#a4a29c" font-style="italic">Same on my laptop and in production.</text></g><g class="in d5"><rect x="422" y="278" width="356" height="236" rx="16" fill="#0f1013" stroke="#22252b"/><text x="446" y="314" class="mono" font-size="11" fill="#6f6f72" letter-spacing="2">05</text><text x="446" y="352" class="serif" font-size="29" fill="#ece8e1">Stores &amp; CMS</text><rect x="446" y="374" width="77" height="30" rx="15" fill="rgba(200,164,101,.08)" stroke="rgba(200,164,101,.5)"/><text x="484.5" y="393.9" class="sans" font-size="13.5" fill="#e3c78f" text-anchor="middle">Shopify</text><rect x="531" y="374" width="92" height="30" rx="15" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="577" y="393.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">WordPress</text><rect x="631" y="374" width="107" height="30" rx="15" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="684.5" y="393.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">WooCommerce</text><rect x="446" y="412" width="69" height="30" rx="15" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="480.5" y="431.9" class="sans" font-size="13.5" fill="#ece8e1" text-anchor="middle">Stripe</text><text x="446" y="490" class="serif" font-size="16.5" fill="#a4a29c" font-style="italic">Stores clients can run themselves.</text></g><g class="in d6"><rect x="796" y="278" width="356" height="236" rx="