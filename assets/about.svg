<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="About: Bhargav Angadi, software developer from India. Builds Java backends, web apps and APIs. Main project BudgetX: Spring Boot microservices behind an API gateway with Kafka, Redis, JWT and a React web app. Started with Tableau and Power BI dashboards. Takes freelance work. Principles: secure by default, fast on every screen, built to hand over.">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131418"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>

</defs>
<style>.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="419" rx="22" fill="url(#card)" stroke="#22252b"/><rect x=".5" y=".5" width="1199" height="419" rx="22" fill="url(#grid)"/><g class="in"><text x="48" y="76" class="serif" font-size="27" fill="#ece8e1">I'm Bhargav, a software developer from India</text><text x="48" y="112" class="serif" font-size="27" fill="#ece8e1">who builds <tspan font-style="italic" fill="#e3c78f">Java backends, web apps and APIs.</tspan></text></g><g class="in d1"><text x="48" y="160" class="sans" font-size="15" fill="#a4a29c">My main project, BudgetX, is a personal-finance app built as</text><text x="48" y="184" class="sans" font-size="15" fill="#a4a29c">Spring Boot microservices behind an API gateway, with Kafka events,</text><text x="48" y="208" class="sans" font-size="15" fill="#a4a29c">Redis rate limiting, JWT auth and a React web app.</text></g><g class="in d2"><text x="48" y="246" class="sans" font-size="15" fill="#a4a29c">I started out building Tableau and Power BI dashboards, so I care</text><text x="48" y="270" class="sans" font-size="15" fill="#a4a29c">about clean data as much as clean code. I also take freelance work:</text><text x="48" y="294" class="sans" font-size="15" fill="#a4a29c">websites, online stores and custom tools for small businesses.</text></g><g class="in d2"><line x1="660" y1="40" x2="1152" y2="40" stroke="#22252b"/><text x="660" y="78" class="serif" font-size="18" fill="#c8a465" font-style="italic">I.</text><text x="704" y="78" class="serif" font-size="27" fill="#ece8e1">Secure by default</text><text x="704" y="103" class="sans" font-size="14" fill="#a4a29c">Tokens checked at the gateway, secrets never committed.</text></g><g class="in d3"><line x1="660" y1="122" x2="1152" y2="122" stroke="#22252b"/><text x="660" y="160" class="serif" font-size="18" fill="#c8a465" font-style="italic">II.</text><text x="704" y="160" class="serif" font-size="27" fill="#ece8e1">Fast on every screen</text><text x="704" y="185" class="sans" font-size="14" fill="#a4a29c">Mobile-first, tuned for budget phones and slow networks.</text></g><g class="in d4"><line x1="660" y1="204" x2="1152" y2="204" stroke="#22252b"/><text x="660" y="242" class="serif" font-size="18" fill="#c8a465" font-style="italic">III.</text><text x="704" y="242" class="serif" font-size="27" fill="#ece8e1">Built to hand over</text><text x="704" y="267" class="sans" font-size="14" fill="#a4a29c">Clean code and a one-command Docker setup.</text></g><line x1="660" y1="286" x2="1152" y2="286" stroke="#22252b"/><g class="in d6"><rect x="48" y="318" width="1104" height="76" rx="14" fill="#0f1013" stroke="#22252b"/><text x="70" y="346" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">ROLE</text><text x="70" y="377" class="serif" font-size="21" fill="#ece8e1">Software developer</text><line x1="324" y1="318" x2="324" y2="394" stroke="#22252b"/><text x="346" y="346" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">CORE STACK</text><text x="346" y="377" class="serif" font-size="21" fill="#ece8e1">Java · Spring Boot · React</text><line x1="600" y1="318" x2="600" y2="394" stroke="#22252b"/><text x="622" y="346" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">BASED IN</text><text x="622" y="377" class="serif" font-size="21" fill="#ece8e1">India</text><line x1="876" y1="318" x2="876" y2="394" stroke="#22252b"/><text x="898" y="346" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">OPEN TO</text><text x="898" y="377" class="serif" font-size="21" fill="#ece8e1">Full-time &amp; freelance</text></g>
</svg>
