<rect x="76" y="230" width="28" height="22" rx="6" fill="none" stroke="#2f333b"/><text x="90" y="245" class="sans" font-size="11" fill="#a4a29c" text-anchor="middle">S</text><rect x="110" y="230" width="28" height="22" rx="6" fill="#c8a465" stroke="#c8a465"/><text x="124" y="245" class="sans" font-size="11" fill="#17130b" text-anchor="middle">M</text><rect x="144" y="230" width="28" height="22" rx="6" fill="none" stroke="#2f333b"/><text x="158" y="245" class="sans" font-size="11" fill="#a4a29c" text-anchor="middle">L</text><rect x="178" y="230" width="32" height="22" rx="6" fill="none" stroke="#2f333b"/><text x="194" y="245" class="sans" font-size="11" fill="#a4a29c" text-anchor="middle">XL</text>
<rect x="76" y="270" width="140" height="38" rx="19" fill="#25d366"/>
<text x="146" y="294" class="sans" font-size="12" fill="#06301a" font-weight="600" text-anchor="middle">Order on WhatsApp</text>
<g opacity="0"><rect x="258" y="92" width="190" height="58" rx="16" fill="#123726"/><text x="274" y="117" class="sans" font-size="13" fill="#e8f5ee">Hi! Is this kurta</text><text x="274" y="136" class="sans" font-size="13" fill="#e8f5ee">available in M?</text>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.12;.85;1" dur="6s" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="278" y="166" width="172" height="58" rx="16" fill="#1a1c21" stroke="#2f333b"/><text x="294" y="191" class="sans" font-size="13" fill="#ece8e1">Yes! Sending you</text><text x="294" y="210" class="sans" font-size="13" fill="#ece8e1">the payment link.</text>
<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.42;.85;1" dur="6s" repeatCount="indefinite"/></g>
<text x="262" y="270" class="mono" font-size="10" fill="#6f6f72" letter-spacing="1.5">ORDERS ARRIVE ON WHATSAPP</text>
<text x="262" y="288" class="mono" font-size="10" fill="#6f6f72" letter-spacing="1.5">STOCK &amp; PAYMENTS IN SHOPIFY</text></g>
