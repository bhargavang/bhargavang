<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 472" width="1200" height="472" role="img" aria-label="Kora Threads: Shopify store for a handmade clothing brand. Small brands often sell only through Instagram DMs and track every order by hand. A customised Shopify store with filters, size guide, discount codes and an &quot;Order on WhatsApp&quot; button. Stack: Shopify, Liquid, JavaScript, CSS. Status: In progress.">
<defs>
<linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#131418"/><stop offset="1" stop-color="#0b0c0e"/></linearGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>

</defs>
<style>.serif{font-family:'Iowan Old Style','Palatino Linotype',Palatino,'Book Antiqua',Georgia,'Times New Roman',serif}.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.in{animation:in 1s cubic-bezier(.16,1,.3,1) both}
.d1{animation-delay:0.12s}.d2{animation-delay:0.24s}.d3{animation-delay:0.36s}.d4{animation-delay:0.48s}.d5{animation-delay:0.60s}.d6{animation-delay:0.72s}.d7{animation-delay:0.84s}.d8{animation-delay:0.96s}.d9{animation-delay:1.08s}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.pulse{animation:pulse 2s ease-in-out infinite}@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#card)" stroke="#22252b"/><rect x=".5" y=".5" width="1199" height="471" rx="22" fill="url(#grid)"/><g class="in"><text x="48" y="60" class="mono" font-size="11.5" fill="#6f6f72" letter-spacing="2.2">03 · ONLINE STORE · SMALL BRANDS · 2026</text><rect x="48" y="78" width="125" height="26" rx="13" fill="#c8a465" fill-opacity=".12" stroke="#c8a465" stroke-opacity=".35"/><circle cx="63" cy="91" r="3.5" fill="#c8a465" class="pulse"/><text x="74" y="95" class="mono" font-size="10.5" fill="#e3c78f" letter-spacing="1.6">IN PROGRESS</text></g><g class="in d1"><text x="44" y="172" class="serif" font-size="62" fill="#ece8e1">Kora Threads</text><text x="48" y="206" class="serif" font-size="22" fill="#e3c78f" font-style="italic">Shopify store for a handmade clothing brand</text></g><g class="in d2"><text x="48" y="244" class="sans" font-size="15" fill="#a4a29c">Small brands often sell only through Instagram DMs and track every</text><text x="48" y="268" class="sans" font-size="15" fill="#a4a29c">order by hand. A customised Shopify store with filters, size guide,</text><text x="48" y="292" class="sans" font-size="15" fill="#a4a29c">discount codes and an &quot;Order on WhatsApp&quot; button.</text></g><line x1="48" y1="322" x2="650" y2="322" stroke="#22252b"/><g class="in d3"><text x="48" y="366" class="serif" font-size="38" fill="#ece8e1">1-tap</text><text x="48" y="390" class="sans" font-size="13" fill="#a4a29c">order on WhatsApp</text><text x="252" y="366" class="serif" font-size="38" fill="#ece8e1">S–XXL</text><text x="252" y="390" class="sans" font-size="13" fill="#a4a29c">size guide pop-up</text><text x="456" y="366" class="serif" font-size="38" fill="#ece8e1">Liquid</text><text x="456" y="390" class="sans" font-size="13" fill="#a4a29c">custom theme sections</text></g><g class="in d4"><rect x="48" y="426" width="72" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="84" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Shopify</text><rect x="126" y="426" width="65" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="158.5" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">Liquid</text><rect x="197" y="426" width="92" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="243" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">JavaScript</text><rect x="295" y="426" width="44" height="26" rx="13" fill="rgba(255,255,255,.02)" stroke="#2f333b"/><text x="317" y="443.0" class="mono" font-size="11" fill="#a4a29c" text-anchor="middle">CSS</text></g><rect x="690" y="24" width="486" height="424" rx="18" fill="#0f1013" stroke="#22252b"/><text x="712" y="52" class="mono" font-size="10" fill="#6f6f72" letter-spacing="2">FIG. 04 · ORDER ON WHATSAPP</text><g transform="translate(693 66)"><defs><linearGradient id="kimg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3226"/><stop offset="1" stop-color="#c8a465"/></linearGradient></defs>
<rect x="60" y="24" width="172" height="316" rx="28" fill="#0f1013" stroke="#2f333b"/>
